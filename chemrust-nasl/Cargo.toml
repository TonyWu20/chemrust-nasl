[package]
name = "chemrust-nasl"
version = "0.4.0"
edition = "2021"
authors = ["TonyWu20"]
readme = "../README.md"
homepage = "https://github.com/TonyWu20/chemrust-nasl"
repository = "https://github.com/TonyWu20/chemrust-nasl"
license = "MIT"
keywords = ["chemistry", "chemistry_research", "catalysis_research", "geometry"]
description = "New Adsorption Site Locator (NASL) for catalyst materials. Written in rust. Part of the `chemrust` toolchain."


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chemrust-geometry = "0.1.0"
nalgebra = "0.33.*"
kd-tree = {git  = "https://github.com/TonyWu20/kd-tree", features=["nalgebra" ]}
elements_rs = { version = "0.2.8", default-features = false }
strum = "0.28"
rayon = "1.10"

[dev-dependencies]
castep-cell-io = "0.7.0"
castep-cell-fmt = "0.3.0"
castep-periodic-table = "0.5.2"
crystal-cif-io = "0.2.0"
kd-tree = {git = "https://github.com/TonyWu20/kd-tree", features = ["nalgebra"]}
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
