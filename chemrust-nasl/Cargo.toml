[package]
name = "chemrust-nasl"
version = "0.4.0"
edition = "2021"
authors = ["TonyWu20"]
readme = "../README.md"
homepage = "https://github.com/TonyWu20/chemrust-nasl"
repository = "https://github.com/TonyWu20/chemrust-nasl"
license = "MIT"
keywords = ["chemistry", "chemistry_research", "catalysis_research", "geometry"]
description = "New Adsorption Site Locator (NASL) for catalyst materials. Written in rust. Part of the `chemrust` toolchain."


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chemrust-core = "0.4.0"
nalgebra = "0.33.*"
kd-tree = {git  = "https://github.com/TonyWu20/kd-tree", features=["nalgebra" ]}
castep-periodic-table = "0.5.2"
rayon = "1.10"

[dev-dependencies]
castep-cell-io = {path = "../../castep-cell-io"}
